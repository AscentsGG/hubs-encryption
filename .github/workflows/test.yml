# Runs the TypeScript tests, the Rust tests (with the live check against the
# TypeScript implementation) and cargo audit on every push and pull request,
# with the Rust that rust/rust-toolchain.toml pins,
# and once a day rebuilds the encryption files and checks that thehubs.gg
# serves exactly those bytes. Actions are pinned to full commit hashes. No
# secrets are used.
name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.10.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.10.0"
      - name: Install the TypeScript implementation for the live check
        working-directory: typescript
        run: npm ci
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Test
        working-directory: rust
        run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust and cargo-audit
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit
        working-directory: rust
        run: cargo audit

  rebuild:
    # The website runs the two files typescript/build.mjs makes, unchanged.
    # Rebuild them from this commit and compare with the signed statement of
    # the release thehubs.gg is running (docs/release-fingerprints.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.10.0"
      - name: Build the encryption files
        working-directory: typescript
        run: |
          npm ci
          npm run build
      - name: Compare with the release thehubs.gg runs
        run: node tools/check-release.mjs --current --rebuilt typescript/dist
